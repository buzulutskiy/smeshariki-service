<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Смешарики — каталог серий по категориям</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff8a3d">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Смешарики">
<style>
  :root {
    --bg: #faf6ef;
    --card: #ffffff;
    --ink: #2d2a26;
    --muted: #8a8378;
    --accent: #ff8a3d;
    --chip-bg: #f0e9dd;
    --shadow: 0 2px 10px rgba(60,45,20,.08);
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    padding: 28px 24px 12px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.3px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .controls {
    max-width: 1200px;
    margin: 14px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search {
    flex: 1 1 260px;
    height: 44px;
    padding: 0 18px;
    border: 2px solid #e7dfd2;
    border-radius: 999px;
    font-size: 15px;
    background: var(--card);
    outline: none;
    transition: border-color .15s;
  }
  .search:focus { border-color: var(--accent); }
  select {
    height: 44px;
    padding: 0 18px;
    border: 2px solid #e7dfd2;
    border-radius: 999px;
    font-size: 15px;
    background: var(--card);
    color: var(--ink);
    outline: none;
    cursor: pointer;
  }
  .chips {
    max-width: 1200px;
    margin: 14px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    border: none;
    background: var(--chip-bg);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s, background .15s, color .15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip:hover { transform: translateY(-1px); }
  .chip.active { background: var(--ink); color: #fff; }
  .chip .n {
    font-size: 11.5px;
    font-weight: 700;
    opacity: .55;
  }
  .meta-line {
    max-width: 1200px;
    margin: 16px auto 0;
    padding: 0 24px;
    color: var(--muted);
    font-size: 13.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .random-btn {
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s, opacity .15s;
  }
  .random-btn:hover { transform: translateY(-1px); opacity: .9; }
  .random-btn:disabled { opacity: .5; cursor: not-allowed; }
  .grid {
    max-width: 1200px;
    margin: 14px auto 60px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(60,45,20,.13); }
  .card h3 { font-size: 16.5px; font-weight: 700; letter-spacing: -.2px; }
  .card .info { font-size: 12.5px; color: var(--muted); }
  .card p {
    font-size: 13.5px;
    color: #57524a;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .essence { display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }
  .ess-line { color: #57524a; }
  .ess-line b { font-weight: 700; color: var(--ink); }
  .modal .essence { margin-bottom: 16px; padding: 14px 16px; background: var(--chip-bg); border-radius: 14px; font-size: 14px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .tag {
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: #6b6459;
  }
  .tag.primary { background: var(--accent); color: #fff; }

  /* stars rating */
  .stars { display: inline-flex; gap: 3px; }
  .stars .star {
    background: none; border: none; padding: 0; cursor: pointer;
    line-height: 1; color: #d9cfbf;
    transition: color .1s, transform .1s;
  }
  .stars .star.filled { color: #ffb020; }
  .stars .star:hover { transform: scale(1.18); }
  .card-rating { color: #ffb020; letter-spacing: 1px; }
  .card-heart { margin-right: 3px; }

  /* tabs */
  .tabs {
    max-width: 1200px; margin: 18px auto 0; padding: 0 24px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .tab {
    border: none; background: var(--chip-bg); color: var(--ink);
    padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform .1s, background .15s, color .15s;
  }
  .tab:hover { transform: translateY(-1px); }
  .tab.active { background: var(--accent); color: #fff; }
  .tab .n { font-size: 12px; font-weight: 700; opacity: .6; margin-left: 3px; }

  /* like (heart) button */
  .like-btn {
    border: 2px solid #e0d8ca; background: transparent; color: var(--ink);
    padding: 9px 18px; line-height: 1.2; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .like-btn:hover { border-color: #ff5a7a; }
  .like-btn.on { border-color: #ff5a7a; background: #ffe0e6; color: #e0335a; }

  /* watched */
  .watch-btn {
    position: absolute;
    top: 14px; right: 14px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid #e0d8ca;
    background: var(--card);
    color: transparent;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .watch-btn:hover { border-color: #35b46f; color: #b9e3cc; }
  .card { position: relative; }
  .card h3 { padding-right: 34px; }
  .card.watched .watch-btn, .modal .watch-btn.on {
    background: #35b46f; border-color: #35b46f; color: #fff;
  }
  .card.watched { opacity: .62; }
  .card.watched:hover { opacity: 1; }
  .modal .watch-btn { position: static; width: auto; height: auto; border: 2px solid #e0d8ca; background: transparent; border-radius: 999px; padding: 9px 18px; line-height: 1.2; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .modal .watch-btn.on { color: #fff; }

  /* modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(40,32,20,.45);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    z-index: 10;
    overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 24px;
    max-width: 700px;
    width: 100%;
    padding: 30px 32px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .modal h2 { font-size: 22px; margin-bottom: 4px; letter-spacing: -.3px; }
  .modal .info { color: var(--muted); font-size: 13.5px; margin-bottom: 14px; }
  .modal .tags { margin: 0 0 16px; padding: 0; }
  .modal p { font-size: 15px; white-space: pre-wrap; color: #453f37; }
  .close {
    position: absolute; top: 16px; right: 16px;
    border: none; background: var(--chip-bg);
    width: 34px; height: 34px; border-radius: 50%;
    font-size: 16px; cursor: pointer; color: var(--ink);
  }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; grid-column: 1/-1; font-size: 15px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --card: #26231f;
      --ink: #f0ebe2;
      --muted: #9a9184;
      --chip-bg: #35312a;
      --shadow: 0 2px 10px rgba(0,0,0,.35);
    }
    .search, select { border-color: #3d382f; color: var(--ink); }
    .card p { color: #b8b0a3; }
    .tag { color: #b8b0a3; }
    .modal p { color: #cfc7ba; }
    .like-btn.on { background: #4a2731; color: #ff9db0; }
  }
</style>
</head>
<body>
<header style="position: relative;">
  <h1>Смешарики<span>.</span> Каталог серий</h1>
  <div class="sub" id="subtitle">Все серии франшизы, разложенные по категориям</div>
  <button id="settingsBtn" style="position: absolute; top: 20px; right: 24px; background: none; border: none; font-size: 20px; cursor: pointer; opacity: .6; transition: opacity .15s;" title="Синхронизация с GitHub">⚙️</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="catalog">📺 Каталог</button>
  <button class="tab" data-tab="favorites">⭐ Любимые <span class="n" id="favCount"></span></button>
  <button class="tab" data-tab="history">🕐 История <span class="n" id="histCount"></span></button>
</nav>

<div class="controls">
  <input class="search" id="search" type="search" placeholder="Поиск по названию и синопсису…">
  <select id="catFilter"><option value="">Все разделы</option></select>
</div>

<div class="chips" id="subchips" style="display:none"></div>

<div class="meta-line">
  <span id="counter"></span>
  <button class="random-btn" id="randomBtn">🎲 Случайная непросмотренная</button>
</div>
<div class="grid" id="grid"></div>

<div class="overlay" id="pollOverlay">
  <div class="modal" style="max-width: 400px; text-align: center;">
    <p style="font-size: 18px; font-weight: 700; margin-bottom: 4px;" id="pollTitle"></p>
    <p style="color: var(--muted); font-size: 13.5px; margin-bottom: 16px;">Как тебе серия?</p>
    <div id="pollStars" class="stars" style="justify-content: center; margin-bottom: 16px; font-size: 36px; gap: 8px;"></div>
    <div style="margin-bottom: 18px;"><button class="like-btn" id="pollLike"></button></div>
    <button id="pollDoneBtn" style="background: var(--accent); color: #fff; border: none; padding: 10px 24px; border-radius: 12px; font-weight: 600; cursor: pointer;">Готово</button>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal" id="settingsModal" style="max-width: 500px;">
    <button class="close" id="closeSettingsBtn">✕</button>
    <h2>⚙️ Синхронизация с GitHub</h2>
    <p style="color: var(--muted); font-size: 14px; margin-bottom: 16px;">
      Сохраняй отметки о просмотре на GitHub Gist и открывай их на любом устройстве.
    </p>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div>
        <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">GitHub Personal Access Token</label>
        <input type="password" id="githubToken" placeholder="ghp_..." style="width: 100%; padding: 10px; border: 2px solid #e0d8ca; border-radius: 12px; font-size: 13px;">
        <div style="font-size: 12px; color: var(--muted); margin-top: 4px;">
          <a href="https://github.com/settings/tokens" target="_blank" style="color: var(--accent);">Создать токен</a> (нужен scope: gist)
        </div>
      </div>
      <div>
        <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">Gist ID</label>
        <input type="text" id="githubGistId" placeholder="28d2a8f110f0111e40562fa4752a6aae" style="width: 100%; padding: 10px; border: 2px solid #e0d8ca; border-radius: 12px; font-size: 13px;">
        <div style="font-size: 12px; color: var(--muted); margin-top: 4px;">
          Последняя часть URL приватного Gist'а
        </div>
      </div>
      <button id="saveGithubBtn" style="background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 8px;">
        Сохранить и синхронизировать
      </button>
      <button id="clearGithubBtn" style="background: transparent; color: var(--muted); border: 2px solid #e0d8ca; padding: 10px; border-radius: 12px; cursor: pointer; font-weight: 600;">
        Отключить синхронизацию
      </button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="close" id="closeBtn">✕</button>
    <h2 id="mTitle"></h2>
    <div class="info" id="mInfo"></div>
    <div class="tags" id="mTags"></div>
    <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;">
      <button class="watch-btn" id="mWatch"></button>
      <button class="like-btn" id="mLike"></button>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 13.5px; color: var(--muted);">Оценка:</span>
        <div id="mStars" class="stars" style="font-size: 26px; gap: 5px;"></div>
      </div>
    </div>
    <div id="mEssence"></div>
    <p id="mPlot"></p>
  </div>
</div>

<script src="data.js?v=4"></script>
<script>
const CATS = window.CATEGORIES;
const EPS = window.EPISODES;
const SUBCATS = window.SUBCATS || {};

// load persisted state from localStorage
const SKEY = "smeshariki-state";
const saved = JSON.parse(localStorage.getItem(SKEY) || "{}");
const state = { tab: saved.tab || "catalog", cat: saved.cat || "", sub: saved.sub || "", q: saved.q || "" };

function saveState() {
  localStorage.setItem(SKEY, JSON.stringify({tab: state.tab, cat: state.cat, sub: state.sub, q: state.q}));
}

// watched marks + likes + dates — persist in localStorage + sync to GitHub Gist
const WKEY = "smeshariki-watched";
const DKEY = "smeshariki-watched-dates";
const LKEY = "smeshariki-liked";
const RKEY = "smeshariki-ratings";
const GKEY = "smeshariki-github";
let watched = new Set(JSON.parse(localStorage.getItem(WKEY) || "[]"));
let watched_dates = JSON.parse(localStorage.getItem(DKEY) || "{}"); // {"key": "2026-07-24"}
let liked = new Set(JSON.parse(localStorage.getItem(LKEY) || "[]"));
let ratings = JSON.parse(localStorage.getItem(RKEY) || "{}"); // {"key": 1..5}
let github = JSON.parse(localStorage.getItem(GKEY) || "{}"); // {token, gistId}
let lastToggled = null; // для быстрого опроса

function epKey(e) { return `${e.series}|${e.num}|${e.title}`; }
function isWatched(e) { return watched.has(epKey(e)); }
function getWatchedDate(e) { return watched_dates[epKey(e)] || null; }
function getRating(e) { return ratings[epKey(e)] || 0; }
function isLiked(e) { return liked.has(epKey(e)); } // «любимые» — отдельно от оценки
function toggleLike(e) {
  const k = epKey(e);
  liked.has(k) ? liked.delete(k) : liked.add(k);
  localStorage.setItem(LKEY, JSON.stringify([...liked]));
  syncToGist();
}
function setRating(e, n) {
  const k = epKey(e);
  if (getRating(e) === n) n = 0; // клик по той же звезде снимает оценку
  if (n > 0) {
    ratings[k] = n;
    // оценка подразумевает, что серия просмотрена
    if (!watched.has(k)) {
      watched.add(k);
      watched_dates[k] = new Date().toISOString().split('T')[0];
      localStorage.setItem(WKEY, JSON.stringify([...watched]));
      localStorage.setItem(DKEY, JSON.stringify(watched_dates));
    }
  } else {
    delete ratings[k];
  }
  localStorage.setItem(RKEY, JSON.stringify(ratings));
  syncToGist();
}

// строим интерактивный ряд из 5 звёзд внутри container
function buildStars(container, e, opts = {}) {
  container.innerHTML = "";
  container.classList.add("stars");
  const paint = n => [...container.children].forEach((b, i) => {
    const on = (i + 1) <= n;
    b.classList.toggle("filled", on);
    b.textContent = on ? "★" : "☆";
  });
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button");
    b.className = "star";
    b.type = "button";
    b.title = i + "★";
    b.onmouseenter = () => paint(i);
    b.onmouseleave = () => paint(getRating(e));
    b.onclick = ev => {
      ev.stopPropagation();
      setRating(e, i);
      paint(getRating(e));
      if (opts.onPick) opts.onPick(getRating(e));
    };
    container.appendChild(b);
  }
  paint(getRating(e));
}

async function syncToGist() {
  if (!github.token || !github.gistId) return;
  try {
    const res = await fetch(`https://api.github.com/gists/${github.gistId}`, {
      method: 'PATCH',
      headers: { 'Authorization': `token ${github.token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        files: {
          'smeshariki-watched.json': { content: JSON.stringify([...watched]) },
          'smeshariki-watched-dates.json': { content: JSON.stringify(watched_dates) },
          'smeshariki-liked.json': { content: JSON.stringify([...liked]) },
          'smeshariki-ratings.json': { content: JSON.stringify(ratings) }
        }
      })
    });
    if (!res.ok) console.warn('Gist sync failed:', res.status);
  } catch (e) { console.warn('Gist sync error:', e.message); }
}

async function loadFromGist() {
  if (!github.token || !github.gistId) return;
  try {
    const res = await fetch(`https://api.github.com/gists/${github.gistId}`, {
      headers: { 'Authorization': `token ${github.token}` }
    });
    if (!res.ok) return;
    const data = await res.json();
    const wContent = data.files['smeshariki-watched.json']?.content;
    const dContent = data.files['smeshariki-watched-dates.json']?.content;
    const lContent = data.files['smeshariki-liked.json']?.content;
    const rContent = data.files['smeshariki-ratings.json']?.content;
    if (wContent) {
      watched = new Set(JSON.parse(wContent));
      localStorage.setItem(WKEY, JSON.stringify([...watched]));
    }
    if (dContent) {
      watched_dates = JSON.parse(dContent);
      localStorage.setItem(DKEY, JSON.stringify(watched_dates));
    }
    if (lContent) {
      liked = new Set(JSON.parse(lContent));
      localStorage.setItem(LKEY, JSON.stringify([...liked]));
    }
    if (rContent) {
      ratings = JSON.parse(rContent);
      localStorage.setItem(RKEY, JSON.stringify(ratings));
    }
  } catch (e) { console.warn('Gist load error:', e.message); }
}

function toggleWatched(e) {
  const k = epKey(e);
  const wasWatched = watched.has(k);
  if (wasWatched) {
    watched.delete(k);
    delete watched_dates[k];
  } else {
    watched.add(k);
    // сохраняем дату в формате YYYY-MM-DD
    const today = new Date().toISOString().split('T')[0];
    watched_dates[k] = today;
  }
  localStorage.setItem(WKEY, JSON.stringify([...watched]));
  localStorage.setItem(DKEY, JSON.stringify(watched_dates));
  syncToGist();
  // if just marked as watched, ask if they liked it
  if (!wasWatched && watched.has(k)) {
    lastToggled = e;
    openQuickPoll(e);
  }
}

function closePoll() {
  document.getElementById("pollOverlay").classList.remove("open");
  document.body.style.overflow = "";
}
function openQuickPoll(e) {
  document.getElementById("pollTitle").textContent = `«${e.title}»`;
  buildStars(document.getElementById("pollStars"), e, { onPick: () => render() });
  const pl = document.getElementById("pollLike");
  const paintPollLike = () => {
    const on = isLiked(e);
    pl.classList.toggle("on", on);
    pl.textContent = on ? "❤️ В любимых" : "🤍 В любимые";
  };
  paintPollLike();
  pl.onclick = () => { toggleLike(e); paintPollLike(); render(); };
  document.getElementById("pollOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("pollDoneBtn").onclick = () => { closePoll(); render(); };
}

const gridEl = document.getElementById("grid");
const counterEl = document.getElementById("counter");
const searchEl = document.getElementById("search");
const catEl = document.getElementById("catFilter");
const subchipsEl = document.getElementById("subchips");
const tabsEl = document.getElementById("tabs");
const randomBtn = document.getElementById("randomBtn");

function catCount(cid) { return EPS.filter(e => e.cats.includes(cid)).length; }

// tabs
tabsEl.querySelectorAll(".tab").forEach(btn => {
  btn.onclick = () => { state.tab = btn.dataset.tab; saveState(); render(); };
});

// category select (только для каталога)
for (const c of CATS) {
  const o = document.createElement("option");
  o.value = c.id;
  o.textContent = `${c.emoji} ${c.name} (${catCount(c.id)})`;
  catEl.appendChild(o);
}
catEl.value = state.cat;
catEl.onchange = () => { state.cat = catEl.value; state.sub = ""; saveState(); render(); };

// под-фильтры подразделов (пока только у «Философии»)
function subCount(cid, sid) { return EPS.filter(e => e.cats.includes(cid) && e.sub === sid).length; }
function buildSubchips() {
  subchipsEl.innerHTML = "";
  const subs = SUBCATS[state.cat];
  if (!subs) return;
  const all = document.createElement("button");
  all.className = "chip" + (!state.sub ? " active" : "");
  all.innerHTML = `Все <span class="n">${EPS.filter(e => e.cats.includes(state.cat)).length}</span>`;
  all.onclick = () => { state.sub = ""; saveState(); render(); };
  subchipsEl.appendChild(all);
  for (const s of subs) {
    const b = document.createElement("button");
    b.className = "chip" + (state.sub === s.id ? " active" : "");
    b.innerHTML = `${s.emoji} ${s.name} <span class="n">${subCount(state.cat, s.id)}</span>`;
    b.onclick = () => { state.sub = state.sub === s.id ? "" : s.id; saveState(); render(); };
    subchipsEl.appendChild(b);
  }
}

// search
searchEl.value = state.q;
searchEl.oninput = () => { state.q = searchEl.value.trim().toLowerCase(); saveState(); render(); };

// random button — случайная непросмотренная (учитывает выбранный раздел)
randomBtn.onclick = () => {
  let list = EPS;
  if (state.cat) list = list.filter(e => e.cats.includes(state.cat));
  list = list.filter(e => !isWatched(e));
  if (!list.length) { alert("Нет непросмотренных серий!"); return; }
  openModal(list[Math.floor(Math.random() * list.length)]);
};

function catById(id) { return CATS.find(c => c.id === id); }

function essenceHTML(e) {
  if (!e.th || !e.th.length) return "";
  let out = `<span class="ess-line">🧩 <b>Темы:</b> ${e.th.join(", ")}</span>`;
  if (e.ref) out += `<span class="ess-line">📖 <b>Отсылка:</b> ${e.ref}</span>`;
  if (e.adult) out += `<span class="ess-line">🧭 <b>По-взрослому:</b> ${e.adult}</span>`;
  return `<div class="essence">${out}</div>`;
}

function matchesSearch(e) {
  if (!state.q) return true;
  return e.title.toLowerCase().includes(state.q) || e.plot.toLowerCase().includes(state.q) ||
    (e.th || []).some(t => t.toLowerCase().includes(state.q)) ||
    (e.ref || "").toLowerCase().includes(state.q) ||
    (e.adult || "").toLowerCase().includes(state.q);
}

function filtered() {
  let list = EPS.filter(matchesSearch);
  if (state.tab === "favorites") {
    // любимые (❤️) — по дате выхода
    list = [...list.filter(isLiked)].sort((a,b) => a.ts - b.ts);
  } else if (state.tab === "history") {
    // история просмотров — свежие сверху по дате просмотра
    list = [...list.filter(isWatched)].sort((a,b) => {
      const da = getWatchedDate(a) || "", db = getWatchedDate(b) || "";
      if (da !== db) return db.localeCompare(da);
      return b.ts - a.ts;
    });
  } else {
    // каталог — по дате выхода, просмотренные опускаются вниз
    if (state.cat) list = list.filter(e => e.cats.includes(state.cat));
    if (state.cat && state.sub && SUBCATS[state.cat]) list = list.filter(e => e.sub === state.sub);
    list = [...list].sort((a,b) => a.ts - b.ts);
    list.sort((a,b) => (isWatched(a) ? 1 : 0) - (isWatched(b) ? 1 : 0));
  }
  return list;
}

function render() {
  // активная вкладка + счётчики
  tabsEl.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
  document.getElementById("favCount").textContent = EPS.filter(isLiked).length || "";
  document.getElementById("histCount").textContent = watched.size || "";

  // селект разделов и «случайная» — только в каталоге
  const inCatalog = state.tab === "catalog";
  catEl.style.display = inCatalog ? "" : "none";
  randomBtn.style.display = inCatalog ? "" : "none";

  // под-фильтры подразделов — только в каталоге и только для раздела, где они есть
  const hasSubs = inCatalog && !!SUBCATS[state.cat];
  subchipsEl.style.display = hasSubs ? "flex" : "none";
  if (hasSubs) buildSubchips();

  const list = filtered();

  if (state.tab === "favorites") {
    counterEl.textContent = `Любимых серий: ${list.length}`;
  } else if (state.tab === "history") {
    counterEl.textContent = `В истории: ${list.length} · всего просмотрено ${watched.size} из ${EPS.length}`;
  } else {
    counterEl.textContent = `Показано: ${list.length} · просмотрено ${watched.size} из ${EPS.length}`;
    let unwatched = EPS;
    if (state.cat) unwatched = unwatched.filter(e => e.cats.includes(state.cat));
    unwatched = unwatched.filter(e => !isWatched(e));
    randomBtn.disabled = !unwatched.length;
    randomBtn.title = unwatched.length ? "" : "Все серии в этом разделе просмотрены";
  }

  gridEl.innerHTML = "";
  if (!list.length) {
    const msg = state.tab === "favorites" ? "Пока нет любимых серий — жми ❤️ «В любимые» в карточке серии"
      : state.tab === "history" ? "История пуста — отмечай серии просмотренными"
      : "Ничего не нашлось — попробуй другой раздел или запрос";
    gridEl.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  for (const e of list) {
    const card = document.createElement("div");
    // затемняем просмотренные только в каталоге (в истории они все просмотрены)
    card.className = "card" + (inCatalog && isWatched(e) ? " watched" : "");
    const parts = [e.series, e.num ? `серия ${e.num}` : "", e.date];
    if (state.tab === "history" && getWatchedDate(e)) parts.push(`👁 ${getWatchedDate(e)}`);
    const info = parts.filter(Boolean).join(" · ");
    const rating = getRating(e);
    const ratingStr = rating ? ` · <span class="card-rating">${"★".repeat(rating)}</span>` : "";
    const heart = isLiked(e) ? `<span class="card-heart">❤️</span>` : "";
    card.innerHTML = `
      <button class="watch-btn" title="Отметить просмотренной">✓</button>
      <h3>${heart}${e.title}</h3>
      <div class="info">${info}${ratingStr}</div>
      ${essenceHTML(e) || `<p>${e.plot}</p>`}
      <div class="tags">${e.cats.map((c,i) => {
        const cat = catById(c);
        return cat ? `<span class="tag ${i===0?"primary":""}">${cat.emoji} ${cat.name}</span>` : "";
      }).join("")}</div>`;
    card.querySelector(".watch-btn").onclick = ev => {
      ev.stopPropagation();
      toggleWatched(e);
      render();
    };
    card.onclick = () => openModal(e);
    frag.appendChild(card);
  }
  gridEl.appendChild(frag);
}

// modal
const overlay = document.getElementById("overlay");
function openModal(e) {
  document.getElementById("mTitle").textContent = e.title;
  const watchedDate = getWatchedDate(e);
  const dateStr = watchedDate ? `просмотрено ${watchedDate}` : "";
  document.getElementById("mInfo").textContent =
    [e.series, e.num ? `серия ${e.num}` : "", e.date, dateStr].filter(Boolean).join(" · ");
  document.getElementById("mTags").innerHTML = e.cats.map((c,i) => {
    const cat = catById(c);
    return cat ? `<span class="tag ${i===0?"primary":""}">${cat.emoji} ${cat.name}</span>` : "";
  }).join("");
  document.getElementById("mEssence").innerHTML = essenceHTML(e);
  document.getElementById("mPlot").textContent = e.plot;
  const mw = document.getElementById("mWatch");
  const ml = document.getElementById("mLike");
  function paintWatch() {
    const on = isWatched(e);
    mw.classList.toggle("on", on);
    mw.textContent = on ? "✓ Просмотрено" : "Отметить просмотренной";
  }
  function paintLike() {
    const on = isLiked(e);
    ml.classList.toggle("on", on);
    ml.textContent = on ? "❤️ В любимых" : "🤍 В любимые";
  }
  paintWatch();
  paintLike();
  buildStars(document.getElementById("mStars"), e, {
    onPick: () => { paintWatch(); render(); }
  });
  mw.onclick = () => { toggleWatched(e); paintWatch(); render(); };
  ml.onclick = () => { toggleLike(e); paintLike(); render(); };
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal() { overlay.classList.remove("open"); document.body.style.overflow = ""; }
document.getElementById("closeBtn").onclick = closeModal;
overlay.onclick = ev => { if (ev.target === overlay) closeModal(); };
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeModal(); });

document.getElementById("subtitle").textContent =
  `${EPS.length} серий франшизы, разложенных по ${CATS.length} категориям`;

// GitHub Gist sync UI
const settingsOverlay = document.getElementById("settingsOverlay");
const settingsModal = document.getElementById("settingsModal");
document.getElementById("settingsBtn").onclick = () => {
  document.getElementById("githubToken").value = github.token || "";
  document.getElementById("githubGistId").value = github.gistId || "";
  settingsOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
};
document.getElementById("closeSettingsBtn").onclick = () => {
  settingsOverlay.classList.remove("open");
  document.body.style.overflow = "";
};
settingsOverlay.onclick = (e) => {
  if (e.target === settingsOverlay) {
    settingsOverlay.classList.remove("open");
    document.body.style.overflow = "";
  }
};

document.getElementById("saveGithubBtn").onclick = async () => {
  const token = document.getElementById("githubToken").value.trim();
  const gistId = document.getElementById("githubGistId").value.trim();
  if (!token || !gistId) { alert("Заполни оба поля"); return; }
  github = { token, gistId };
  localStorage.setItem(GKEY, JSON.stringify(github));
  await loadFromGist();
  render();
  alert("Сохранено! Отметки загружены с гиста.");
  settingsOverlay.classList.remove("open");
  document.body.style.overflow = "";
};

document.getElementById("clearGithubBtn").onclick = () => {
  github = {};
  localStorage.removeItem(GKEY);
  alert("Синхронизация отключена.");
  settingsOverlay.classList.remove("open");
  document.body.style.overflow = "";
};

// load from gist on init
(async () => {
  if (github.token && github.gistId) await loadFromGist();
  render();
})();

// service worker — офлайн-доступ (кеширует оболочку и данные при первой загрузке)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

</script>
</body>
</html>
